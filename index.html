*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);color:var(--txt);background-color:var(--bg);

.container{max-width:1100px;margin:0 auto;padding:0 16px}
.mut{color:var(--mut)} .mut2{color:var(--mut2)} .small{font-size:12px} .xs{font-size:11px}

.bvio{color:var(--vio)} .brose{color:var(--rose)} .bfux{color:var(--fux)} .bora{color:var(--ora)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.hidden{display:none!important}
/* ── Header ── */
header.nav{position:sticky;top:0;z-index:100;border-bottom:2px solid var(--line);background:rgba(11,16,38,.92);backdrop-filter:blur(10px)}
.nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}

.logo:hover .zap{transform:rotate(8deg)}
.logo b{font-family:var(--fd);font-size:19px;letter-spacing:-.3px}
.navlinks{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:12px;font-size:12px;font-weight:800;color:var(--mut);text-decoration:none;white-space:nowrap}
.navlinks a:hover{background:rgba(255,255,255,.06);color:#fff}
.navlinks a.on{background:rgba(139,92,246,.22);color:#ddd6fe}

.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:2px solid;font-size:11px;font-weight:900;white-space:nowrap}
.icbtn{border:2px solid;font-weight:900;border-radius:12px;padding:7px 12px;cursor:pointer;font-family:var(--fd);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
/* ── Componenti ── */
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:24px}
.card.sm{padding:16px;border-radius:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:15px;padding:13px 22px;border-radius:16px;border:2px solid;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .12s;user-select:none}
.btn.solid{color:#0b1026;box-shadow:0 5px 0 var(--ink)}
.btn:hover{transform:scale(1.03)} .btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 16px;font-size:13px;border-radius:13px}
.btn.big{padding:17px 28px;font-size:17px}
.btn.block{width:100%}
.bar{height:14px;border-radius:999px;background:#0a0e24;border:2px solid var(--ink);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;transition:width .8s ease}
.field{width:100%;background:#0a0e24;border:2px solid #2b3560;border-radius:16px;padding:13px 16px;color:#fff;font-family:var(--fb);font-weight:700;font-size:14px;outline:none}
.field:focus{border-color:var(--cy)}
.tag{display:inline-flex;align-items:center;gap:6px;border:2px solid;padding:4px 12px;border-radius:999px;font-family:var(--fd);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.divider{height:2px;background:var(--line);border-radius:2px}
.kick{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:5px 14px;border:2px solid;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.badgebox{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);flex-shrink:0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;background:rgba(11,16,38,.7);border:2px solid #2b3560;border-radius:16px;padding:13px 16px;color:var(--txt);font-weight:800;font-size:14px;cursor:pointer;transition:.15s}

.marquee{overflow:hidden;border-block:2px solid var(--line);background:var(--card2);padding:12px 0}
.marquee>div{display:flex;gap:34px;width:max-content;animation:mq 26s linear infinite;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut2)}
@keyframes mq{to{transform:translateX(-50%)}}
/* ── Mock telefono ── */
.phone{max-width:360px;margin:0 auto;border:2px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 8px 0 var(--ink);background:#0a1f1c}
.phone .ph-head{display:flex;align-items:center;gap:10px;background:#0d2b27;padding:12px 14px;border-bottom:1px solid rgba(16,185,129,.2)}

.bub{max-width:88%;background:#10352e;color:#d1fae5;border-radius:16px 16px 16px 5px;padding:12px;font-size:13.5px;line-height:1.5}
.mail{background:var(--card2);max-width:520px;margin:0 auto;border:2px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);overflow:hidden}
.mail .m-head{display:flex;gap:6px;align-items:center;background:var(--card);padding:11px 14px;border-bottom:2px solid var(--line)}
.dot{width:11px;height:11px;border-radius:50%}

#toasts{position:fixed;bottom:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:min(92vw,360px)}
.toast{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid;border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:14px;animation:tin .3s ease}

#modal{position:fixed;inset:0;background:rgba(5,8,26,.86);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:400;padding:16px}
#modal.open{display:flex}

table.compare{width:100%;min-width:620px;border-collapse:collapse;font-size:13px}
table.compare th,table.compare td{padding:12px 10px;border-bottom:1px solid var(--line2);text-align:center}
table.compare td:first-child,table.compare th:first-child{text-align:left}

/* ── Certificato statico ── */
#certWrap{display:flex;justify-content:center}

.cert-in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:4.5% 6%}
.cert-name{font-family:var(--fd);font-weight:700;color:#1e2a5a;font-size:clamp(26px,4.5vw,46px)}
.cert-rule{height:3px;width:260px;max-width:80%;background:linear-gradient(90deg,transparent,#c9a227,transparent);margin:4px auto}
/* ── Stampa ── */
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff!important;background-image:none!important}
  .no-print{display:none!important}
  #certWrap{position:static}

</style>

function hasComp(k,r){return S.comp.some(c=>c.k===k&&c.r===r)}
